<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#051c2e"/>
      <stop offset="100%" stop-color="#020a12"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08E1E8"/>
      <stop offset="100%" stop-color="#006699"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#08E1E8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card Container -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#border-grad)" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Subtle Cyber Mesh Grid Lines -->
  <path d="M12 0V64M24 0V64M36 0V64M48 0V64" stroke="#08E1E8" stroke-width="0.5" stroke-opacity="0.12"/>
  <path d="M0 12H64M0 24H64M0 36H64M0 48H64" stroke="#08E1E8" stroke-width="0.5" stroke-opacity="0.12"/>

  <!-- Shield Shape Outline -->
  <path d="M32 12C39 12 46 14.5 46 14.5V28C46 38.5 39.5 46 32 50C24.5 46 18 38.5 18 28V14.5C18 14.5 25 12 32 12Z" 
        fill="#041828" 
        stroke="url(#cyan-glow)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Envelope Graphic inside Shield -->
  <path d="M23 22H41C42.1 22 43 22.9 43 24V36C43 37.1 42.1 38 41 38H23C21.9 38 21 37.1 21 36V24C21 22.9 21.9 22 23 22Z" 
        fill="none" 
        stroke="#08E1E8" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <path d="M21 24L32 31L43 24" 
        stroke="#00F0FF" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Glowing Verification Checkmark Badge -->
  <circle cx="44" cy="42" r="8" fill="#020C14" stroke="#00F0FF" stroke-width="1.5"/>
  <path d="M40.5 42L43 44.5L47.5 39.5" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
